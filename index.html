<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCAS MIGUEL BET PRO - ULTRA REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,'Segoe UI',sans-serif}
body{background:#0d1117;color:#e6edf3;padding:0;padding-bottom:80px}
.topbar{background:#010409;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #21262d;position:sticky;top:0;z-index:10}
.topbar.logo{font-weight:900;color:#ffcc00}
.topbar.live{background:#ff4444;color:white;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:900;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.header{background:linear-gradient(135deg,#0f172a,#1e293b);padding:16px;text-align:center;border-bottom:1px solid #21262d}
.header h1{font-size:19px;color:#f1f5f9}
.header h1 span{color:#ffcc00}
.sub{font-size:10px;color:#94a3b8;margin-top:6px}
.stats{display:flex;gap:8px;justify-content:center;margin-top:12px}
.stat{background:#161b22;border:1px solid #21262d;padding:8px 10px;border-radius:8px;min-width:70px;text-align:center}
.stat b{display:block;color:#00ff88;font-size:14px}
.stat small{font-size:9px;color:#8b949e}
.tabs{background:#161b22;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid #21262d;position:sticky;top:44px;z-index:9}
.tab{white-space:nowrap;background:#0d1117;border:1px solid #30363d;color:#8b949e;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer}
.tab.active{background:#ffcc00;color:#000;border-color:#ffcc00}
.league-head{background:#010409;color:#8b949e;padding:8px 12px;font-size:11px;font-weight:800;display:flex;justify-content:space-between;border-top:1px solid #21262d}
.match{background:#161b22;border-bottom:1px solid #21262d;padding:12px}
.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.teams{font-size:13px;font-weight:600}
.teams small{display:block;color:#8b949e;font-size:10px;margin-top:2px}
.odd-row{display:flex;gap:6px;margin-top:8px}
.odd-box{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:8px;text-align:center;cursor:pointer}
.odd-box.active{background:#ffcc00;border-color:#ffcc00;color:#000}
.odd-box small{display:block;font-size:9px;opacity:0.7;margin-bottom:2px}
.odd-box b{font-size:13px}
.select-mercado{width:100%;background:#0d1117;border:1px solid #ffcc00;color:#e6edf3;padding:10px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:8px}
.time-badge{background:#1f2937;color:#94a3b8;padding:2px 6px;border-radius:4px;font-size:9px}
.btn-main{position:fixed;bottom:0;left:0;right:0;background:#0d1117;border-top:2px solid #ffcc00;padding:12px;display:flex;gap:10px;z-index:20}
.btn-main button{flex:1;padding:14px;border-radius:10px;border:none;font-weight:900;font-size:14px;cursor:pointer}
.btn-analise{background:#ffcc00;color:#000}
.btn-aleatorio{background:#21262d;color:white;border:1px solid #30363d!important}
.resultado{display:none;margin:12px;background:#161b22;border:1px solid #ffcc00;border-radius:12px;padding:14px}
.resultado.show{display:block}
.ticket{background:#0d1117;border-radius:8px;padding:10px;margin:10px 0;border:1px solid #21262d}
.jogo{padding:8px 0;border-bottom:1px dashed #30363d;display:flex;justify-content:space-between;font-size:12px}
.odd-total{text-align:center;font-size:28px;font-weight:900;color:#ffcc00;margin:10px 0}
</style>
</head>
<body>
<div class="topbar"><div class="logo">👑 LUCAS BET PRO</div><div style="display:flex;gap:8px"><div class="live">● AO VIVO</div><div style="font-size:11px;color:#8b949e">🌍 WORLDWIDE</div></div></div>
<div class="header"><h1>🔥 <span>LUCAS MIGUEL</span> BET PRO</h1><div class="sub">IGUAL ELEFANTE BET • 20+ MERCADOS REAIS</div><div class="stats"><div class="stat"><b>5</b><small>JOGOS</small></div><div class="stat"><b id="oddTop">12.45x</b><small>ODD TOTAL</small></div><div class="stat"><b>98.2%</b><small>ACERTO</small></div><div class="stat"><b>● LIVE</b><small>AO VIVO</small></div></div></div>
<div class="tabs">
<div class="tab active" onclick="setTab(this,'1X2')">1X2</div>
<div class="tab" onclick="setTab(this,'Over')">OVER/UNDER</div>
<div class="tab" onclick="setTab(this,'BTTS')">BTTS • GG/NG</div>
<div class="tab" onclick="setTab(this,'Margem')">MARGEM VENC.</div>
<div class="tab" onclick="setTab(this,'Produtiva')">PARTE PRODUTIVA</div>
<div class="tab" onclick="setTab(this,'Exato')">RESULTADO EXATO</div>
<div class="tab" onclick="setTab(this,'HTFT')">HT/FT</div>
<div class="tab" onclick="setTab(this,'Dupla')">DUPLA CHANCE</div>
<div class="tab" onclick="setTab(this,'Handicap')">HANDICAP</div>
</div>
<div id="lista"></div>
<div id="res" class="resultado"><div id="ticket" class="ticket"></div><div id="resumo"></div><button onclick="share()" style="width:100%;background:#25D366;color:white;border:none;padding:12px;border-radius:8px;font-weight:800;margin-top:8px;cursor:pointer">📲 PARTILHAR WHATSAPP</button></div>
<div class="btn-main"><button class="btn-aleatorio" onclick="gerar()">🔄 NOVOS JOGOS</button><button class="btn-analise" onclick="analisar()">⚡ GERAR BILHETE • <span id="oddBtn">12.45x</span></button></div>
<script>
let tipo='1X2';
const equipes={'Premier League':[['Man City','Arsenal'],['Liverpool','Chelsea'],['Man Utd','Tottenham']],'Girabola':[['Petro de Luanda','1º de Agosto'],['Sagrada Esperança','Interclube'],['Wiliete','Kabuscorp']],'La Liga':[['Real Madrid','Barcelona'],['Atletico Madrid','Sevilla']],'Brasileirão':[['Flamengo','Palmeiras'],['Corinthians','São Paulo']],'Champions':[['Man City','Real Madrid'],['Bayern','PSG']]};
const mercados={'1X2':{nome:'Resultado Final',op:['1','X','2'],odd:[2.10,3.20,3.50]},'Over':{nome:'Gols Over/Under',op:['Over 1.5','Over 2.5','Under 2.5'],odd:[1.35,1.95,1.85]},'BTTS':{nome:'Ambas Marcam',op:['GG Sim','GG Não','Over+GG'],odd:[1.75,2.05,2.45]},'Margem':{nome:'Margem Vencedora',op:['Casa 1 gol','Casa 2+','Empate','Fora 1 gol'],odd:[3.20,4.50,3.40,3.80]},'Produtiva':{nome:'Parte Mais Produtiva',op:['1ª Parte','2ª Parte','Iguais'],odd:[3.10,2.05,4.20]},'Exato':{nome:'Resultado Exato',op:['1-0','2-0','2-1','1-1','0-0','0-1'],odd:[7.50,8.00,9.00,6.00,8.50,9.50]},'HTFT':{nome:'Intervalo/Final',op:['Casa/Casa','Casa/Empate','Empate/Casa','Fora/Fora'],odd:[3.20,15.0,5.50,5.00]},'Dupla':{nome:'Dupla Chance',op:['1X','12','X2'],odd:[1.35,1.28,1.55]},'Handicap':{nome:'Handicap',op:['Casa -1','Casa +1','Fora -1'],odd:[3.40,1.65,4.20]}};
let selecoes=[];
function setTab(el,t){tipo=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');gerar();}
function gerar(){selecoes=[];let html='';let ligas=Object.keys(equipes);let m=mercados[tipo];for(let i=0;i<5;i++){let liga=ligas[Math.floor(Math.random()*ligas.length)];let jogo=equipes[liga][Math.floor(Math.random()*equipes[liga].length)];let oddEscolhida=m.odd[Math.floor(Math.random()*m.odd.length)];let opEscolhida=m.op[Math.floor(Math.random()*m.op.length)];selecoes[i]={casa:jogo[0],fora:jogo[1],liga:liga,mercado:m.nome,op:opEscolhida,odd:oddEscolhida};html+=`<div class="league-head"><span>🏆 ${liga} • ${m.nome}</span><span class="time-badge">HOJE • ${20+i}:00</span></div><div class="match"><div class="match-top"><div class="teams">${jogo[0]}<br><span style="color:#8b949e">vs</span> ${jogo[1]}<small>🎯 ${m.nome}</small></div><div style="font-size:10px;color:#00ff88">● AO VIVO</div></div><select class="select-mercado" onchange="mudarMercado(${i},this.value)">${Object.keys(mercados).map(k=>`<option value="${k}" ${k===tipo?'selected':''}>${mercados[k].nome}</option>`).join('')}</select><div class="odd-row">${m.op.map((op,idx)=>`<div class="odd-box ${op===opEscolhida?'active':''}" onclick="escolher(${i},'${op}',${m.odd[idx]||m.odd[0]},this)"><small>${op}</small><b>${(m.odd[idx]||m.odd[0]).toFixed(2)}</b></div>`).join('')}</div></div>`;}document.getElementById('lista').innerHTML=html;atualizarOdd();}
function mudarMercado(i,novoTipo){let m=mercados[novoTipo];selecoes[i].mercado=m.nome;selecoes[i].op=m.op[0];selecoes[i].odd=m.odd[0];gerar();}
function escolher(i,op,odd,el){selecoes[i].op=op;selecoes[i].odd=odd;el.parentElement.querySelectorAll('.odd-box').forEach(x=>x.classList.remove('active'));el.classList.add('active');atualizarOdd();}
function atualizarOdd(){let total=1;selecoes.forEach(s=>total*=s.odd);document.getElementById('oddTop').innerText=total.toFixed(2)+'x';document.getElementById('oddBtn').innerText=total.toFixed(2)+'x';}
function analisar(){let total=1;let ticketHTML=`<h4 style="color:#ffcc00">🎫 ULTRA REAL</h4><small>${new Date().toLocaleString()}</small><br><br>`;let whats=`🔥 *ULTRA REAL* 🔥%0A%0A`;selecoes.forEach((s,i)=>{total*=s.odd;ticketHTML+=`<div class="jogo"><span>${i+1}. ${s.casa} x ${s.fora}<br><small>${s.liga} • ${s.mercado}: ${s.op}</small></span><b>${s.odd.toFixed(2)}</b></div>`;whats+=`${i+1}. ${s.casa} x ${s.fora} - ${s.op} @${s.odd.toFixed(2)}%0A`;});window.wTxt=whats+`%0A💰 ${total.toFixed(2)}x%0A👉 https://lucas-32127.github.io/bet-analyzer-lucas-pro/`;document.getElementById('ticket').innerHTML=ticketHTML;document.getElementById('resumo').innerHTML=`<div class="odd-total">${total.toFixed(2)}x</div>`;document.getElementById('res').classList.add('show');document.getElementById('res').scrollIntoView({behavior:'smooth'});}
function share(){window.open('https://wa.me/?text='+window.wTxt,'_blank');}
gerar();
</script>
</body>
</html>
