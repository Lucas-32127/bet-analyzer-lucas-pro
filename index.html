<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneXpress Bet ZON</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff;padding-bottom:80px}.top{background:#0a0a0a;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff6a00;position:sticky;top:0}.logo{font-weight:900;color:#ff6a00}.logo span{color:#00d4ff;font-size:10px;display:block}.btn{background:#ff6a00;color:#fff;border:0;padding:8px 12px;border-radius:6px;font-weight:900;font-size:11px}.bal{display:none;background:#111;border:1px solid #ff6a00;padding:6px 10px;border-radius:6px}.bal.show{display:block}.menu{display:flex;gap:8px;padding:10px;background:#0a0a0a}.menu button{flex:1;padding:10px;border-radius:8px;border:0;font-weight:900;font-size:11px}.dep{background:#00c851;color:#fff}.saq{background:#ff6a00;color:#fff}.card{background:#111;border:1px solid #222;border-radius:10px;padding:10px;margin:8px}.odd{display:flex;gap:6px;margin-top:8px}.odd div{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:8px;text-align:center}.odd div.on{background:#ff6a00}.bet{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #ff6a00;padding:12px;transform:translateY(100%);transition:.3s}.bet.show{transform:translateY(0)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:20px;z-index:99}.modal.show{display:flex}.box{background:#111;border:1px solid #333;border-radius:12px;padding:16px;width:100%;max-width:340px}.box input{width:100%;padding:10px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px}.box button{width:100%;padding:12px;margin-top:6px;border-radius:6px;border:0;font-weight:900}</style></head><body>
<div class="top"><div class="logo">OneXpress Bet <span>ZON 🇦🇴</span></div><div style="display:flex;gap:6px"><div id="bal" class="bal"><b id="saldo">0 Kz</b></div><button class="btn" id="bLogin" onclick="openM('login')">ENTRAR</button><button class="btn" style="background:#222" id="bReg" onclick="openM('reg')">REGISTAR</button></div></div>
<div class="menu" id="menu" style="display:none"><button class="dep" onclick="openM('dep')">💳 DEPOSITAR MCX</button><button class="saq" onclick="openM('saq')">💸 LEVANTAR</button></div>
<div style="padding:10px"><div style="background:#1a1a1a;padding:10px;border-radius:8px;display:flex;justify-content:space-between"><span>HISTÓRICO</span><span style="color:#00ff88">● AO VIVO</span></div><div id="lista"></div></div>
<div class="bet" id="bet"><div id="itens"></div><input id="valor" type="number" value="500" style="width:100%;padding:10px;background:#000;border:1px solid #333;color:#fff;border-radius:6px;margin:8px 0"><div>Odd: <b id="oddT">1.00x</b> | Retorno: <b id="ret" style="color:#00ff88">0 Kz</b></div><button class="btn" style="width:100%;margin-top:8px" onclick="apostar()">FAZER APOSTA ZON</button></div>

<div id="mLogin" class="modal"><div class="box"><h3 style="color:#ff6a00;text-align:center">ENTRAR ZON</h3><input id="lTel" placeholder="Telefone"><input id="lPass" type="password" placeholder="Senha"><button style="background:#ff6a00;color:#fff" onclick="login()">ENTRAR</button><button style="background:#222;color:#fff" onclick="closeM()">FECHAR</button></div></div>
<div id="mReg" class="modal"><div class="box"><h3 style="color:#ff6a00;text-align:center">REGISTAR ZON +1000 KZ BONUS</h3><input id="rNome" placeholder="Nome"><input id="rTel" placeholder="Telefone"><input id="rPass" type="password" placeholder="Senha"><button style="background:#ff6a00;color:#fff" onclick="reg()">CRIAR CONTA</button><button style="background:#222;color:#fff" onclick="closeM()">FECHAR</button></div></div>
<div id="mDep" class="modal"><div class="box"><h3 style="color:#00c851;text-align:center">DEPOSITAR MCX EXPRESS</h3><p style="font-size:11px;color:#888;margin-bottom:8px">Multicaixa Express • Express • Referencia</p><input id="dVal" type="number" value="2000" placeholder="Valor min 500 Kz"><input id="dTel" placeholder="Telefone MCX 923..."><button style="background:#00c851;color:#fff" onclick="dep()">DEPOSITAR AGORA</button><button style="background:#222;color:#fff" onclick="closeM()">FECHAR</button></div></div>
<div id="mSaq" class="modal"><div class="box"><h3 style="color:#ff6a00;text-align:center">LEVANTAR MCX EXPRESS</h3><div>Saldo: <b id="sSaq">0 Kz</b></div><input id="sVal" type="number" placeholder="Valor min 1000 Kz"><input id="sIban" placeholder="Telefone ou IBAN"><button style="background:#ff6a00;color:#fff" onclick="saq()">PEDIR LEVANTAMENTO</button><button style="background:#222;color:#fff" onclick="closeM()">FECHAR</button></div></div>

<script>
let user=JSON.parse(localStorage.getItem('zon_user')||'null');
let bol=[];let trans=JSON.parse(localStorage.getItem('zon_trans')||'[]');
let jogos=[['Petro Luanda','1 Agosto'],['Man City','Arsenal'],['Real Madrid','Barcelona'],['Flamengo','Palmeiras'],['Sagrada','Interclube']];
function init(){if(user){document.getElementById('bLogin').style.display='none';document.getElementById('bReg').style.display='none';document.getElementById('bal').classList.add('show');document.getElementById('menu').style.display='flex';document.getElementById('saldo').innerText=user.saldo.toLocaleString()+' Kz';document.getElementById('sSaq').innerText=user.saldo.toLocaleString()+' Kz';}render();}
function render(){let h='';jogos.forEach(j=>{let o1=(Math.random()*1+1.5).toFixed(2);let o2=(Math.random()*1+2.5).toFixed(2);let o3=(Math.random()*1+2).toFixed(2);h+=`<div class="card"><div style="font-size:11px;color:#666">HOJE 20:00 ● AO VIVO • OneXpress Bet ZON</div><div style="font-weight:700;margin:6px 0">${j[0]} vs ${j[1]}</div><div class="odd"><div onclick="add('${j[0]} vs ${j[1]}','Casa',${o1},this)">1<br><b>${o1}</b></div><div onclick="add('${j[0]} vs ${j[1]}','Empate',${o2},this)">X<br><b>${o2}</b></div><div onclick="add('${j[0]} vs ${j[1]}','Fora',${o3},this)">2<br><b>${o3}</b></div></div></div>`;});document.getElementById('lista').innerHTML=h;}
function openM(t){closeM();document.getElementById('m'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('show');}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));}
function reg(){let n=document.getElementById('rNome').value;let t=document.getElementById('rTel').value;let p=document.getElementById('rPass').value;if(!n||!t||!p)return alert('Preencha tudo');user={nome:n,tel:t,pass:p,saldo:0};localStorage.setItem('zon_user',JSON.stringify(user));alert('Conta criada ZON! Faça deposito e ganhe 1000 Kz bonus');closeM();location.reload();}
function login(){let t=document.getElementById('lTel').value;let p=document.getElementById('lPass').value;let u=JSON.parse(localStorage.getItem('zon_user')||'null');if(u&&u.tel==t&&u.pass==p){closeM();location.reload();}else alert('Dados errados');}
function add(j,m,o,el){if(!user){openM('login');return;}el.classList.toggle('on');let i=bol.findIndex(b=>b.j==j);if(i>=0)bol.splice(i,1);else bol.push({j,m,o});showBet();}
function showBet(){let b=document.getElementById('bet');if(bol.length==0){b.classList.remove('show');return;}b.classList.add('show');document.getElementById('itens').innerHTML=bol.map(x=>`<div style="font-size:11px">${x.j} - ${x.m} @${x.o}</div>`).join('');let tot=bol.reduce((a,b)=>a*b.o,1);document.getElementById('oddT').innerText=tot.toFixed(2)+'x';let v=parseFloat(document.getElementById('valor').value)||0;document.getElementById('ret').innerText=(v*tot).toLocaleString()+' Kz';}
function apostar(){let v=parseFloat(document.getElementById('valor').value)||0;if(v>user.saldo){alert('Saldo insuficiente, faz deposito MCX Express');openM('dep');return;}user.saldo-=v;localStorage.setItem('zon_user',JSON.stringify(user));alert('Aposta feita ZON! Retorno: '+(v*bol.reduce((a,b)=>a*b.o,1)).toLocaleString()+' Kz');bol=[];showBet();init();}
function dep(){let v=parseFloat(document.getElementById('dVal').value)||0;let t=document.getElementById('dTel').value;if(v<500)return alert('Min 500 Kz');user.saldo+=v+1000;alert('Deposito MCX Express confirmado! +'+v+' Kz + 1000 Kz BONUS ZON!');localStorage.setItem('zon_user',JSON.stringify(user));closeM();location.reload();}
function saq(){let v=parseFloat(document.getElementById('sVal').value)||0;if(v<1000)return alert('Min 1000 Kz');if(v>user.saldo)return alert('Saldo insuficiente');user.saldo-=v;localStorage.setItem('zon_user',JSON.stringify(user));alert('Levantamento pedido! Receberas '+(v*0.98).toLocaleString()+' Kz via MCX Express em 15min-2h (taxa 2%)');closeM();location.reload();}
document.getElementById('valor').addEventListener('input',showBet);
init();
</script></body></html>
